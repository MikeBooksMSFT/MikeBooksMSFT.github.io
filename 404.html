<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Mike Books</title>
  <meta name="robots" content="noindex">
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-surface: #ffffff;
      --cp-border: #dedede;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-fg: #ffffff;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-surface: #292929;
      --cp-border: #474747;
      --cp-text: #dedede;
      --cp-text-muted: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-fg: #1a1a1a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--cp-bg);
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
    }
    main {
      width: min(720px, 100%);
      padding: 32px;
      border: 1px solid var(--cp-border);
      border-radius: 20px;
      background: var(--cp-surface);
      text-align: center;
    }
    .eyebrow {
      color: var(--cp-accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    h1 {
      margin: 12px 0 16px;
      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1.1;
      letter-spacing: -0.04em;
    }
    p {
      margin: 0;
      color: var(--cp-text-muted);
    }
    a {
      display: inline-flex;
      margin-top: 24px;
      padding: 12px 18px;
      border: 1px solid var(--cp-accent);
      border-radius: 12px;
      background: var(--cp-accent);
      color: var(--cp-accent-fg);
      text-decoration: none;
      font-weight: 600;
    }
    a:hover {
      background: var(--cp-accent-hover);
      border-color: var(--cp-accent-hover);
    }
    :focus-visible {
      outline: 3px solid var(--cp-accent);
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Redirecting</p>
    <h1>That link has moved.</h1>
    <p id="message">If you are not redirected, use the button below.</p>
    <a id="home-link" href="/">Go to home</a>
  </main>
  <script>
    const legacyVideoPath = "/videos/walgreens-intelligence-platform.mp4";
    const welcomePagePath = "/videos/walgreens-intelligence-platform/";

    if (window.location.pathname === legacyVideoPath) {
      const target = `${welcomePagePath}${window.location.search}${window.location.hash}`;
      window.location.replace(target);
    } else {
      document.getElementById("message").textContent = "The page you requested could not be found.";
    }
  </script>
</body>
</html>

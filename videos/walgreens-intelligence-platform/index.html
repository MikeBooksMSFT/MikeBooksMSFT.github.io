<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Private Intelligence Platform | Mike Books</title>
  <meta name="description" content="Welcome page for a private intelligence platform video.">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://mikebooksmsft.github.io/videos/walgreens-intelligence-platform/">
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-surface: #ffffff;
      --cp-border: #dedede;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-fg: #ffffff;
      --cp-danger: #dc2626;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-surface: #292929;
      --cp-border: #474747;
      --cp-text: #dedede;
      --cp-text-muted: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-fg: #1a1a1a;
      --cp-danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--cp-bg);
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
      padding: 24px;
    }
    main {
      width: min(900px, 100%);
      background: var(--cp-surface);
      border: 1px solid var(--cp-border);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
    }
    .page-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px 20px;
      padding-bottom: 16px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--cp-border);
      font-size: 0.9rem;
    }
    .page-header a {
      text-decoration: none;
      font-weight: 600;
    }
    .eyebrow {
      color: var(--cp-accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    h1 {
      margin: 12px 0 16px;
      font-size: clamp(2.2rem, 6vw, 3.6rem);
      line-height: 1.08;
      letter-spacing: -0.04em;
    }
    p {
      margin: 0;
      color: var(--cp-text-muted);
    }
    .gate,
    .player {
      margin-top: 28px;
      border: 1px solid var(--cp-border);
      border-radius: 16px;
      padding: 24px;
    }
    form {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }
    label {
      flex: 1 1 260px;
    }
    input {
      width: 100%;
      min-height: 48px;
      margin-top: 8px;
      padding: 12px 14px;
      border: 1px solid var(--cp-border);
      border-radius: 12px;
      background: var(--cp-surface);
      color: var(--cp-text);
      font: inherit;
    }
    button {
      min-height: 48px;
      padding: 12px 18px;
      border: 1px solid var(--cp-accent);
      border-radius: 12px;
      background: var(--cp-accent);
      color: var(--cp-accent-fg);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      align-self: end;
    }
    button:hover {
      background: var(--cp-accent-hover);
      border-color: var(--cp-accent-hover);
    }
    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }
    .status {
      min-height: 1.5em;
      margin-top: 14px;
      color: var(--cp-text-muted);
      font-size: 0.95rem;
    }
    .status.error {
      color: var(--cp-danger);
    }
    .tip {
      margin-top: 12px;
      font-size: 0.92rem;
      color: var(--cp-text-muted);
    }
    .player[hidden] {
      display: none;
    }
    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      background: #000;
    }
    .player p {
      margin-top: 14px;
    }
    a {
      color: inherit;
    }
    :focus-visible {
      outline: 3px solid var(--cp-accent);
      outline-offset: 4px;
    }
    @media (max-width: 640px) {
      main {
        padding: 24px;
      }
      .gate,
      .player {
        padding: 18px;
      }
      form {
        flex-direction: column;
      }
      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <nav class="page-header" aria-label="Profile links">
      <a href="../../#top">View Mike's profile</a>
      <a href="../../">Go to main site</a>
    </nav>
    <p class="eyebrow">Private video access</p>
    <h1>Welcome.</h1>
    <p id="intro-copy">Enter the password to view this private intelligence platform video.</p>

    <section class="gate" id="gate">
      <form id="password-form">
        <label for="password">
          Password
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit" id="submit-button">View video</button>
      </form>
      <p class="tip">Need the password? Contact me at <a id="contact-link" href="mailto:michaelbooks@microsoft.com?subject=private%20video%20password">michaelbooks@microsoft.com</a>.</p>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="player" id="player" hidden>
      <video id="video" controls playsinline preload="metadata" aria-label="Private intelligence platform video">
        <source id="video-source" data-src="./video.mp4" type="video/mp4">
        Your browser cannot play this video.
      </video>
      <p><a href="../../">Back to home</a></p>
    </section>
  </main>
  <script>
    const BRAND_NAME = "Walgreens";
    const PASSWORD_HASH = "27e7606035a83cf1036adfdd24ab3b0c1800d20699592a457366b3854145db97";
    const MAX_ATTEMPTS = 3;
    const STORAGE_KEY = "walgreens-intelligence-platform-access-v2";
    let remainingAttempts = MAX_ATTEMPTS;

    const form = document.getElementById("password-form");
    const passwordInput = document.getElementById("password");
    const submitButton = document.getElementById("submit-button");
    const status = document.getElementById("status");
    const gate = document.getElementById("gate");
    const player = document.getElementById("player");
    const introCopy = document.getElementById("intro-copy");
    const contactLink = document.getElementById("contact-link");
    const video = document.getElementById("video");
    const videoSource = document.getElementById("video-source");
    const pageDescription = document.querySelector('meta[name="description"]');

    const revealBranding = () => {
      document.title = `${BRAND_NAME} Intelligence Platform | Mike Books`;
      if (pageDescription) {
        pageDescription.setAttribute(
          "content",
          `Welcome page for the ${BRAND_NAME} Intelligence Platform video.`,
        );
      }
      if (introCopy) {
        introCopy.textContent = `Enter the password to view the ${BRAND_NAME} Intelligence Platform video.`;
      }
      if (contactLink) {
        contactLink.href = `mailto:michaelbooks@microsoft.com?subject=${encodeURIComponent(`${BRAND_NAME} video password`)}`;
      }
      video.setAttribute("aria-label", `${BRAND_NAME} Intelligence Platform video`);
    };

    const showVideo = () => {
      revealBranding();
      if (!videoSource.src) {
        videoSource.src = videoSource.dataset.src;
        video.load();
      }
      gate.hidden = true;
      player.hidden = false;
    };

    const lockAccess = () => {
      passwordInput.disabled = true;
      submitButton.disabled = true;
      status.textContent = "Maximum attempts reached. Contact me at michaelbooks@microsoft.com for the password.";
      status.classList.add("error");
    };

    const sha256 = async (value) => {
      const data = new TextEncoder().encode(value);
      const digest = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(digest))
        .map((byte) => byte.toString(16).padStart(2, "0"))
        .join("");
    };

    if (sessionStorage.getItem(STORAGE_KEY) === "granted") {
      showVideo();
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      submitButton.disabled = true;
      status.classList.remove("error");
      status.textContent = "Checking password…";

      try {
        const hash = await sha256(passwordInput.value);
        if (hash === PASSWORD_HASH) {
          sessionStorage.setItem(STORAGE_KEY, "granted");
          status.textContent = "";
          passwordInput.value = "";
          showVideo();
          video.focus();
        } else {
          remainingAttempts -= 1;
          if (remainingAttempts <= 0) {
            lockAccess();
          } else {
            status.textContent = `Incorrect password. ${remainingAttempts} attempt${remainingAttempts === 1 ? "" : "s"} remaining.`;
            status.classList.add("error");
            passwordInput.select();
          }
        }
      } catch (error) {
        status.textContent = "This browser could not verify the password.";
        status.classList.add("error");
      } finally {
        if (remainingAttempts > 0 && !passwordInput.disabled) {
          submitButton.disabled = false;
        }
      }
    });
  </script>
</body>
</html>
